[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "care_sound_monitor"
version = "0.1.0"
authors = [{name = "Grupo 4 (G4)"}]
description = "Sistema de reconocimiento de sonidos domésticos para el apoyo en el cuidado de personas con necesidades especiales (ESC-50, TDSP, Git + DVC + MLflow)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "soundfile",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
dvc = ["dvc"]

[tool.setuptools.packages.find]
where = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
